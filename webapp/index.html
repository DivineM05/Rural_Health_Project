<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Setup</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin: 0.5rem 0; font-size: 1.1rem; }
  input[type=text] { width: 100%; padding: 0.6rem; font-size: 1.1rem; box-sizing: border-box; }
  button { margin-top: 1rem; padding: 0.8rem 1.2rem; font-size: 1.1rem; }
  #map { height: 320px; margin-top: 0.5rem; }
  #results button { display: block; width: 100%; margin-top: 0.3rem; text-align: left; font-size: 0.95rem; }
  #qr { margin-top: 1.5rem; }
  #qr img { width: 320px; max-width: 100%; }
</style>
</head>
<body>
<h1>Patient Setup</h1>
<h2>Location</h2>
<input type="text" id="search" placeholder="Search for a village, town or address">
<button id="searchButton">Search</button>
<div id="results"></div>
<div id="map"></div>
<p>Tap the map or drag the pin to adjust. Selected: <strong id="selected">none</strong></p>
<h2>Conditions at risk for</h2>
<div id="conditions"></div>
<h2>Recurring checkup</h2>
<label>First checkup date <input type="date" id="startDate"></label>
<label>Repeat every
  <input type="number" id="interval" value="1" min="1" style="width:4rem">
  <select id="unit">
    <option value="days">days</option>
    <option value="weeks">weeks</option>
    <option value="months" selected>months</option>
    <option value="years">years</option>
  </select>
</label>
<button id="generate">Generate QR code</button>
<div id="qr"></div>
<script src="qrcode.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [0, 20],
  zoom: 1,
});
let marker = null;
let selectedLocation = null;

function selectLocation(name, latitude, longitude) {
  selectedLocation = {
    name,
    latitude: Math.round(latitude * 100000) / 100000,
    longitude: Math.round(longitude * 100000) / 100000,
  };
  if (!marker) {
    marker = new maplibregl.Marker({ draggable: true }).setLngLat([longitude, latitude]).addTo(map);
    marker.on('dragend', () => {
      const position = marker.getLngLat();
      selectLocation(selectedLocation.name, position.lat, position.lng);
    });
  }
  marker.setLngLat([longitude, latitude]);
  document.getElementById('selected').textContent =
    `${selectedLocation.name} (${selectedLocation.latitude}, ${selectedLocation.longitude})`;
}

map.on('click', (event) => {
  const name = selectedLocation ? selectedLocation.name : 'Pinned location';
  selectLocation(name, event.lngLat.lat, event.lngLat.lng);
});

document.getElementById('searchButton').onclick = async () => {
  const query = document.getElementById('search').value.trim();
  if (!query) return;
  const resultsContainer = document.getElementById('results');
  resultsContainer.textContent = 'Searching...';
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(query)}`;
  const results = await (await fetch(url)).json();
  resultsContainer.textContent = results.length === 0 ? 'No results' : '';
  for (const result of results) {
    const button = document.createElement('button');
    button.textContent = result.display_name;
    button.onclick = () => {
      const latitude = Number(result.lat);
      const longitude = Number(result.lon);
      selectLocation(result.display_name, latitude, longitude);
      map.jumpTo({ center: [longitude, latitude], zoom: 13 });
      resultsContainer.textContent = '';
    };
    resultsContainer.append(button);
  }
};

const conditionOptions = [
  'Diabetes',
  'High blood pressure',
  'Heart disease',
  'Asthma / COPD',
  'Pregnancy',
  'Kidney disease',
];

const conditionsContainer = document.getElementById('conditions');
for (const condition of conditionOptions) {
  const label = document.createElement('label');
  label.innerHTML = '<input type="checkbox"> ';
  label.append(condition);
  label.firstChild.value = condition;
  conditionsContainer.append(label);
}

document.getElementById('generate').onclick = () => {
  const location = selectedLocation;
  if (!location) {
    alert('Search for and select a location');
    return;
  }
  const startDate = document.getElementById('startDate').value;
  if (!startDate) {
    alert('Enter the first checkup date');
    return;
  }
  const checkupSchedule = {
    startDate,
    interval: Number(document.getElementById('interval').value),
    unit: document.getElementById('unit').value,
  };
  const conditions = [...conditionsContainer.querySelectorAll('input:checked')].map((box) => box.value);
  const qr = qrcode(0, 'M');
  qr.addData(JSON.stringify({ location, conditions, checkupSchedule }));
  qr.make();
  document.getElementById('qr').innerHTML = qr.createImgTag(8);
};
</script>
</body>
</html>
